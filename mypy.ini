# Managed by copier from ZacKienzle2/repo-template. mypy reads the first of
# mypy.ini, .mypy.ini and pyproject.toml it finds, so this file is the whole
# configuration; the settings are the Scientific Python Development Guide's
# recommendation. A repository's own per-module sections, a package that
# ships no types or a module whose decorators are untyped, are the
# mypy_overrides answer in .copier-answers.yml, rendered after the global
# section, so nothing here is written by hand.
[mypy]
python_version = 3.12
strict = True
warn_unreachable = True
enable_error_code = ignore-without-code, redundant-expr, truthy-bool
