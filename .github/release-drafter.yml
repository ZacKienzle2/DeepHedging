name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

version-resolver:
  major:
    labels:
      - "breaking"
  minor:
    labels:
      - "feat"
  patch:
    labels:
      - "fix"
      - "perf"
  default: patch

categories:
  - title: "Breaking Changes"
    labels:
      - "breaking"
  - title: "New Features"
    labels:
      - "feat"
  - title: "Bug Fixes"
    labels:
      - "fix"
  - title: "Performance"
    labels:
      - "perf"
  - title: "Documentation"
    labels:
      - "docs"
  - title: "Maintenance"
    labels:
      - "refactor"
      - "test"
      - "build"
      - "ci"
      - "chore"
      - "style"
      - "revert"
  - title: "Dependencies"
    labels:
      - "dependencies"

change-template: "- $TITLE (#$NUMBER) by @$AUTHOR"
change-title-escapes: '\<*_&'
exclude-labels:
  - "skip-changelog"

autolabeler:
  - label: "breaking"
    title:
      - '/^[a-z]+(\([^)]+\))?!:/'
    body:
      - "/BREAKING[ -]CHANGE:/"
  - label: "feat"
    title:
      - "/^feat(\\([^)]+\\))?!?:/"
  - label: "fix"
    title:
      - "/^fix(\\([^)]+\\))?!?:/"
  - label: "perf"
    title:
      - "/^perf(\\([^)]+\\))?!?:/"
  - label: "docs"
    title:
      - "/^docs(\\([^)]+\\))?!?:/"
  - label: "refactor"
    title:
      - "/^refactor(\\([^)]+\\))?!?:/"
  - label: "test"
    title:
      - "/^test(\\([^)]+\\))?!?:/"
  - label: "build"
    title:
      - "/^build(\\([^)]+\\))?!?:/"
  - label: "ci"
    title:
      - "/^ci(\\([^)]+\\))?!?:/"
  - label: "chore"
    title:
      - "/^chore(\\([^)]+\\))?!?:/"
  - label: "style"
    title:
      - "/^style(\\([^)]+\\))?!?:/"
  - label: "revert"
    title:
      - "/^revert(\\([^)]+\\))?!?:/"

template: |
  ## What's Changed

  $CHANGES

  ## Contributors

  $CONTRIBUTORS

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
