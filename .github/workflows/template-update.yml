# The lint configuration comes from ZacKienzle2/repo-template through copier,
# and this is copier's documented way to move a generated project when its
# template changes: `copier update` reads .copier-answers.yml, renders the
# template at its current commit and applies the difference, leaving a hunk
# it cannot apply over a local edit as a conflict with git's markers. The pull
# request is opened by peter-evans/create-pull-request, which commits whatever
# changed and updates the same pull request on later runs. A run with nothing
# new changes no file and opens nothing.
#
# A pull request opened with the job token does not start workflows, which
# GitHub documents as its guard against recursive runs. TEMPLATE_UPDATE_TOKEN,
# a fine-grained token with contents and pull-requests write, lifts that. When
# the secret is absent the job token is used and the checks start once a
# reviewer closes and reopens the pull request.
name: Template update

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: template-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Update from the template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Update from the template
        run: uvx copier update --defaults --trust

      # The hooks' formatters settle what a render leaves them, prose wrapped
      # around this repository's own names or JSON the template serialised,
      # so the pull request carries formatted files and CI's hooks find
      # nothing to change. A formatter that changed a file exits non-zero,
      # which is pre-commit's contract, so the step continues either way.
      - name: Run the hooks over the update
        run: uvx pre-commit run --all-files
        continue-on-error: true

      - name: Open the pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.TEMPLATE_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          branch: build/template-update
          delete-branch: true
          commit-message: "build(config): update from the shared template"
          title: "build(config): update from the shared template"
          body: |
            `copier update` against ZacKienzle2/repo-template at its current
            commit. Conflict markers in a file are a hunk copier could not
            apply over a local edit; resolve them before merging.
