name: Release Drafter

on:
  push:
    branches: [main]
  # pull_request rather than pull_request_target. zizmor's remediation is to
  # replace the latter "unless you absolutely need repository write
  # permissions", which a pull request from a fork would; release-drafter's own
  # example uses pull_request and reserves the other for forks, and labeler
  # says the same. No repository here takes pull requests from forks.
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

concurrency:
  group: release-drafter
  cancel-in-progress: false

jobs:
  update_release_draft:
    name: Update release draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Draft release
        uses: release-drafter/release-drafter@6a93d829887aa2e0748befe2e808c66c0ec6e4c7 # v6.4.0
        with:
          config-name: release-drafter.yml
          disable-autolabeler: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
