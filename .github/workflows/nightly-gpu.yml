name: Nightly GPU

# The fused kernels, graph capture and the device benchmarks need CUDA, which
# no hosted runner has. pytest-benchmark keeps each night's result in a storage
# directory outside the checkout and compares the next run against it, so the
# regression gate is the plugin's own rather than a committed baseline measured
# on a different device.
on:
  schedule:
    - cron: "0 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly-gpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gpu:
    name: GPU tests and benchmarks
    runs-on: [self-hosted, gpu]
    timeout-minutes: 60
    env:
      UV_NO_SYNC: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync dependencies
        run: uv sync --frozen

      # The lock resolves the CPU wheel on Linux, so a Linux GPU runner swaps in
      # the CUDA build of the same version. UV_NO_SYNC keeps uv run from
      # reinstalling the locked wheel over it.
      - name: Install the CUDA build of torch on Linux
        if: runner.os == 'Linux'
        run: >-
          uv pip install --reinstall "torch==$(uv run python -c 'import torch;
          print(torch.__version__.split("+")[0])')" --index-url
          https://download.pytorch.org/whl/cu130

      - name: Require a CUDA device
        run:
          uv run python -c "import torch; assert torch.cuda.is_available(), 'the
          GPU lane must fail rather than skip'"

      - name: GPU tests
        run: uv run pytest -m gpu --benchmark-skip

      - name: Benchmarks against the previous night on this runner
        shell: bash
        run: >-
          uv run pytest -m gpu --benchmark-only --benchmark-autosave
          --benchmark-storage="file://$HOME/.cache/deephedging/benchmarks"
          --benchmark-compare --benchmark-compare-fail=median:15% -W
          ignore::pytest_benchmark.logger.PytestBenchmarkWarning
