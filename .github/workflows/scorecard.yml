# Derived from the workflow GitHub publishes at
# actions/starter-workflows/code-scanning/scorecard.yml, with two deliberate
# departures from it. Every action is pinned to a digest rather than a tag,
# which is what Scorecard's own Pinned-Dependencies check asks for and what
# Dependabot then moves. And the weekly cron is gone: a scan on every push to
# the default branch and on every pull request already covers what changes,
# and a schedule spends minutes on a tree nobody touched.
#
# `gh api repos/actions/starter-workflows/contents/code-scanning/scorecard.yml`
# prints the current upstream to compare against.
name: OpenSSF Scorecard

on:
  branch_protection_rule: {}
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.repository.private == false
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: results.sarif
