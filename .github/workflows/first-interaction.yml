name: First Interaction

on:
  issues:
    types: [opened]
  # pull_request rather than pull_request_target. zizmor's remediation is to
  # replace the latter "unless you absolutely need repository write
  # permissions", which a pull request from a fork would; release-drafter's own
  # example uses pull_request and reserves the other for forks, and labeler
  # says the same. No repository here takes pull requests from forks.
  pull_request:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: first-interaction-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  welcome:
    name: Welcome first-time contributors
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2.19.3
        with:
          egress-policy: audit

      - name: Greet
        uses: actions/first-interaction@1c4688942c71f71d4f5502a26ea67c331730fa4d # v3.1.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          issue_message: >
            First issue. Acknowledgement within 7 days. Confirm reproduction steps, expected vs actual, environment. See
            SUPPORT.md.
          pr_message: >
            First PR. Confirm Conventional Commits, rebased on main, CI green. See CONTRIBUTING.md.
