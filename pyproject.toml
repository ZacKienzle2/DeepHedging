[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deephedging"
version = "0.1.0"
description = "Deep hedging research framework: neural hedging policies under market frictions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "pyright>=1.1.350",
]

[tool.hatch.build.targets.wheel]
packages = ["src/deephedging"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
