[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deephedging"
version = "0.1.0"
description = "Deep hedging research framework: neural hedging policies under market frictions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.12.1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "pyright>=1.1.411",
]
notebook = [
    "matplotlib>=3.11.0",
    "ipykernel>=7.3.0,<10",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[tool.hatch.build.targets.wheel]
packages = ["src/deephedging"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: training-loop and large Monte Carlo tests (tens of seconds)",
    "gpu: requires a CUDA device",
]

[tool.coverage.run]
source = ["deephedging"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "\\.\\.\\.",
]

[dependency-groups]
dev = [
    "ninja>=1.13.0",
]
