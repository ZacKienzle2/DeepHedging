[build-system]
requires = ["hatchling>=1.26", "hatch-vcs"]
build-backend = "hatchling.build"


[project]
name = "deephedging"
authors = [
  { name = "Zac Kienzle", email = "zac.kienzle@gmail.com" },
]
description = "Neural hedging policies (GRU, deep-set, no-trade-band) minimising CVaR, entropic and spectral risk under transaction costs, on fused CUDA kernels at billions of paths per second, with a deep BSDE pricer."
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = ["mpmath>=1.3", "torch>=2.2,<3"]

[project.optional-dependencies]
notebook = ["matplotlib>=3.8", "ipykernel>=6.29,<10"]

[project.urls]
Homepage = "https://github.com/ZacKienzle2/DeepHedging"
"Bug Tracker" = "https://github.com/ZacKienzle2/DeepHedging/issues"
Discussions = "https://github.com/ZacKienzle2/DeepHedging/discussions"
Changelog = "https://github.com/ZacKienzle2/DeepHedging/releases"


[dependency-groups]
test = [
  "hypothesis >=6",
  "ninja >=1.13.0",
  "numpy >=2",
  "pytest >=9",
  "pytest-benchmark >=5",
  "pytest-cov >=7",
]
dev = [
  { include-group = "test" },
]
docs = [
  "sphinx>=7.0",
  "myst_parser>=0.13",
  "sphinx_copybutton",
  "sphinx_autodoc_typehints",
  "furo>=2023.08.17",
]


[tool.hatch]
version.source = "vcs"
build.hooks.vcs.version-file = "src/deephedging/_version.py"

[tool.hatch.envs.default]
dependency-groups = ["dev"]

[tool.hatch.envs.hatch-test]
dependency-groups = ["test"]
env-vars.PYTHONWARNDEFAULTENCODING = "1"


[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]


[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "--showlocals", "--import-mode=importlib"]
strict = true
filterwarnings = [
  "error",
  "ignore:_get_vc_env is private:UserWarning",
  "ignore:`torch.jit.script_method` is deprecated:DeprecationWarning",
]
log_level = "INFO"
testpaths = [
  "tests",
]
markers = [
  "slow: training-loop and large Monte Carlo tests (tens of seconds)",
  "gpu: requires a CUDA device",
]


[tool.coverage]
run.source = ["deephedging"]
run.branch = true
report.show_missing = true
report.exclude_also = [
  '\.\.\.',
  'if typing.TYPE_CHECKING:',
  'if TYPE_CHECKING:',
  'raise NotImplementedError',
  '@(abc\.)?abstractmethod',
]

[tool.mypy]
files = ["src", "tests"]
mypy_path = "src"
explicit_package_bases = true
python_version = "3.12"
warn_unused_configs = true
strict = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unreachable = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
untyped_calls_exclude = ["torch", "pytest_benchmark"]

[[tool.mypy.overrides]]
module = "deephedging.*"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "mpmath.*"
ignore_missing_imports = true


[tool.ruff]
show-fixes = true

[tool.ruff.lint]
extend-select = [
  "ARG",    # flake8-unused-arguments
  "B",      # flake8-bugbear
  "C4",     # flake8-comprehensions
  "D",      # pydocstyle
  "EM",     # flake8-errmsg
  "EXE",    # flake8-executable
  "FURB",   # refurb
  "G",      # flake8-logging-format
  "ICN",    # flake8-import-conventions
  "ISC",    # flake8-implicit-str-concat
  "LOG",    # flake8-logging
  "NPY",    # NumPy specific rules
  "PD",     # pandas-vet
  "PERF",   # perflint
  "PGH",    # pygrep-hooks
  "PL",     # pylint
  "PT",     # flake8-pytest-style
  "PTH",    # flake8-use-pathlib
  "PYI",    # flake8-pyi
  "Q",      # flake8-quotes
  "RET",    # flake8-return
  "RSE",    # flake8-raise
  "RUF",    # Ruff-specific
  "SIM",    # flake8-simplify
  "SLOT",   # flake8-slots
  "T10",    # flake8-debugger
  "T20",    # flake8-print
  "TC",     # flake8-type-checking
  "TRY",    # tryceratops
  "UP",     # pyupgrade
]
ignore = [
  "PLR09",    # Too many <...>
  "PLR2004",  # Magic value used in comparison
  "TRY003",   # Long exception messages outside the exception class
]
# Uncomment if using a _compat.typing backport
# typing-modules = ["deephedging._compat.typing"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D103", "T20"]
"noxfile.py" = ["D", "T20"]
"docs/conf.py" = ["D"]
"src/**" = ["TC003"]
"experiments/**" = ["T20"]
"src/deephedging/market/cuda.py" = ["PLC0415"]
"*.ipynb" = ["T20"]
