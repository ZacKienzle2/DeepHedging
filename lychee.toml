cache = true
max_cache_age = "1d"
max_concurrency = 8
max_redirects = 5
timeout = 20
retry_wait_time = 2
# 403 is accepted: a public reference site that answers a scanner with
# Forbidden, cppreference among them, is reachable from a browser, and a dead
# link answers 404 or 410, which still fail.
accept = ["200", "204", "206", "301", "302", "303", "307", "308", "403", "429"]
no_progress = true
include_verbatim = false
include_fragments = "none"
# lychee's own switches in place of the path and pattern lists that used to
# sit here: it skips what .gitignore names and hidden directories unless told
# otherwise, leaves example domains and mail addresses alone by default, and
# this excludes loopback addresses and localhost. Discussions are enabled on
# every repository SUPPORT.md points at, so that link is checked like any
# other.
exclude_loopback = true
